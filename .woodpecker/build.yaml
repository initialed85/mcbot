# Build, publish, and deploy mcbot.
#
# Three steps, in an order that matters. The policy suites gate the publish: a regression in an allowlist must
# not produce a published `:latest`. The image checks gate the deploy: the boundary has to hold in the artifact
# that gets deployed, not only in the source that got reviewed. The deploy step then writes the commit sha into
# the manifests repository, which *is* the deploy - Argo CD does the rollout and `git revert` is the rollback.
#
# The infrastructure names in this file (which dockerd to build against, which image to publish, which manifests
# repository to deploy into) are the owner's, not the code's: nothing in the shipped program reads them. A fork
# replaces this file; `test-config.py` checks the code instead, and deliberately does not check this one.
steps:
  - name: test-policy
    # Pure-stdlib assertions about who may make mcbot write, what counts as "just asking", how RCON is framed,
    # and what the wrappers do when they decide no. No dependencies, no secrets, runs on the clone rather than
    # the built image - which is the point: these are the checks that must fail before anything is published.
    #
    # `hygiene.py` is here rather than only inside the image because this is the one step with a `.git`, and
    # therefore the one that can see every tracked file. The copy of the rule that runs during the build sees
    # what the image ships, which is the stricter question about what a stranger receives - and blind to a
    # document nobody installs. A maintenance note that names a hostname is published just the same.
    #
    # test-config.py is NOT here, deliberately: it imports bot.py to assert the vision-injection contract, and
    # bot.py imports discord.py, so it cannot run in a dependency-free step. It runs in build-and-push, inside
    # the published image, which is the only place discord.py exists. A pipeline that fails with
    # ModuleNotFoundError in the gate step gates nothing; it just stops publishing.
    image: docker.io/library/python:3.12-slim
    commands:
      - python3 hygiene.py
      - python3 test-bot-policy.py
      - python3 test-rcon.py
      - python3 test-gate.py

  - name: build-and-push
    image: docker.io/library/docker:cli
    privileged: true
    depends_on:
      - test-policy
    environment:
      DOCKER_HOST: tcp://docker-beefcake-ci-1:2375
      IMAGE: docker.io/initialed85/mcbot
    backend_options:
      kubernetes:
        secrets:
          - name: dockerhub
            key: username
            target:
              env: DOCKERHUB_USER
          - name: dockerhub
            key: token
            target:
              env: DOCKERHUB_TOKEN
    commands:
      - docker info --format 'daemon={{.Name}} images_before={{.Images}}'
      # Preflight, because a wedged dockerd and a bad credential look identical from `docker login`'s error:
      # a daemon that accepts :2375 and never answers produces three login timeouts and a log that reads like a
      # registry problem. `docker ps` with a short budget says which it is in 25 seconds.
      - |
        if ! timeout 25 docker ps -q >/dev/null 2>&1; then
          echo 'the docker daemon is accepting connections but not serving them (docker ps hung).'
          echo 'That is a wedged daemon, not a registry or credential problem - check the node before the secret.'
          exit 1
        fi
        echo 'dockerd responsive'
      # `docker login` has a ~30s client timeout of its own and nothing retries it, so a brief registry blip
      # fails the lane before a single layer is built. Three attempts with spacing that outlasts it, and an
      # explicit failure if all three miss, so a bad credential still reads as one.
      - |
        logged_in=0
        for attempt in 1 2 3; do
          if printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin;
          then
            logged_in=1
            break
          fi
          echo "docker login attempt $attempt failed; retrying in 20s"
          sleep 20
        done
        if [ "$logged_in" != 1 ]; then
          echo 'docker login failed after 3 attempts - check DOCKERHUB_* secret and node egress'
          exit 1
        fi
      - docker build -f Dockerfile -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:latest" .
      - docker push "$IMAGE:$CI_COMMIT_SHA"
      - docker push "$IMAGE:latest"
      - docker inspect --format 'digest={{.RepoDigests}}' "$IMAGE:$CI_COMMIT_SHA"
      # The wrapper has to win on PATH. If this ever prints something other than the wrapper, the bot has an
      # unguarded `git`/`kubectl` and the premise of the sandbox is gone, so fail the build rather than deploy
      # it. Asserting the *real* path here would be the bug in this file: /usr/bin/kubectl is what the wrapper
      # execs, not what the agent resolves.
      - docker run --rm --entrypoint sh "$IMAGE:$CI_COMMIT_SHA"
        -c 'test "$(command -v git)" = /usr/local/bin/git; echo "git resolves to $(command -v git)"'
      - docker run --rm --entrypoint sh "$IMAGE:$CI_COMMIT_SHA"
        -c 'test "$(command -v kubectl)" = /usr/local/bin/kubectl; test "$(command -v mc-rcon)" = /usr/local/bin/mc-rcon;
            test -x /usr/bin/kubectl; echo "wrappers on PATH, real kubectl still reachable as MCBOT_KUBECTL_REAL"'
      # And the wrapper has to actually refuse, not merely exist: run the boundary suite against a scratch repo
      # inside the built image.
      - docker run --rm --entrypoint bash "$IMAGE:$CI_COMMIT_SHA" /opt/mcbot/test-git-shim.sh
      # Build the real client with the image's real discord.py. The policy suite stubs discord, and a stub cannot
      # report a missing attribute: `discord.CommandTree` passed the stub, passed a plain `import bot`, and then
      # killed the pod at startup. Construction is the assertion.
      - docker run --rm --entrypoint python3 "$IMAGE:$CI_COMMIT_SHA" /opt/mcbot/test-image-smoke.py
      # The startup contract, with stubbed git/kubectl/pi and a local repository: it must refuse when a required
      # variable is missing, clone from the URL it was given, and generate pi's provider file rather than ship
      # somebody's. Runs inside the image because it imports bot.py, which imports discord.py.
      - docker run --rm --entrypoint python3 "$IMAGE:$CI_COMMIT_SHA" /opt/mcbot/test-config.py
      - docker run --rm --entrypoint pi "$IMAGE:$CI_COMMIT_SHA" --version
      - docker run --rm --entrypoint kubectl "$IMAGE:$CI_COMMIT_SHA" version --client
      - docker system df

  - name: deploy-manifests
    # A plugin step: `settings:` only, which is what makes Woodpecker treat it as a plugin. Values arrive
    # verbatim - no $CI_* expansion - so the tag comes from the plugin's own default of CI_COMMIT_SHA.
    #
    # This writes into the manifests repository, not this one, so the pipeline cannot trigger itself: the commit
    # it makes is not a push to this repository.
    image: docker.io/initialed85/wp-kustomize-deploy:latest
    depends_on:
      - build-and-push
    settings:
      image: docker.io/initialed85/mcbot
      dir: clusters/dev/applications/minecraft-bot
      repo: git@github.com:initialed85/home-ops.git
      branch: master
    backend_options:
      kubernetes:
        secrets:
          - name: home-ops-deploy-key
            key: id_ed25519
            target:
              env: PLUGIN_DEPLOY_KEY
          - name: home-ops-deploy-key
            key: known_hosts
            target:
              env: PLUGIN_KNOWN_HOSTS

when:
  branch: master
  event: push
