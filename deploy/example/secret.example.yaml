# The secret half of an mcbot deployment. Rename this file, put it somewhere git does not read, and apply it out
# of band. `MCBOT_PI_API_KEY_ENV` in the ConfigMap is what names the variable below, so this file may call the
# key anything as long as the two agree.
apiVersion: v1
kind: Secret
metadata:
  name: mcbot-secret
  namespace: mcbot
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: "<bot-token>"
  MCBOT_PI_API_KEY: "<inference-provider-key>"
  # Required while the in-game ask path is on.
  MCBOT_RCON_PASSWORD: "<rcon-password>"
